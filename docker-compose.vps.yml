services:
  postgres:
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pol
      POSTGRES_USER: ${POL_DB_USER}
      POSTGRES_PASSWORD: ${POL_DB_PASSWORD}
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/certs/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/certs/server.key", "-c", "max_connections=100", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    volumes:
      - pol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [pol_internal]

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    environment:
      ENVIRONMENT: production
      POL_API_DB_NAME: pol
      POL_API_DB_HOST: postgres
      POL_API_DB_PORT: "5432"
      POL_API_DB_USER: ${POL_DB_USER}
      POL_API_DB_PASSWORD: ${POL_DB_PASSWORD}
      POL_API_DB_SSLMODE: require
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "scripts.migrate_prod"]
    networks: [pol_internal]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      POL_API_DB_NAME: pol
      POL_API_DB_HOST: postgres
      POL_API_DB_PORT: "5432"
      POL_API_DB_USER: ${POL_DB_USER}
      POL_API_DB_PASSWORD: ${POL_DB_PASSWORD}
      POL_API_DB_SSLMODE: require
      POL_JWT_SECRET: ${POL_JWT_SECRET}
      POL_CORS_ORIGINS: ${POL_CORS_ORIGINS}
      POL_S3_ENDPOINT_URL: ${POL_S3_ENDPOINT_URL:-}
      POL_S3_ACCESS_KEY_ID: ${POL_S3_ACCESS_KEY_ID:-}
      POL_S3_SECRET_ACCESS_KEY: ${POL_S3_SECRET_ACCESS_KEY:-}
      POL_S3_REGION: ${POL_S3_REGION:-us-east-1}
      POL_S3_BUCKET: ${POL_S3_BUCKET:-pol-media}
      POL_SMS_PROVIDER: ${POL_SMS_PROVIDER:-SMSIR}
      POL_SMS_ENDPOINT: ${POL_SMS_ENDPOINT:-}
      POL_SMS_TOKEN: ${POL_SMS_TOKEN:-}
      POL_PUSH_PROVIDER: ${POL_PUSH_PROVIDER:-GENERIC_PUSH}
      POL_PUSH_ENDPOINT: ${POL_PUSH_ENDPOINT:-}
      POL_PUSH_TOKEN: ${POL_PUSH_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    networks: [pol_internal]

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      POL_API_DB_NAME: pol
      POL_API_DB_HOST: postgres
      POL_API_DB_PORT: "5432"
      POL_API_DB_USER: ${POL_DB_USER}
      POL_API_DB_PASSWORD: ${POL_DB_PASSWORD}
      POL_API_DB_SSLMODE: require
      POL_SMS_PROVIDER: ${POL_SMS_PROVIDER:-SMSIR}
      POL_SMS_ENDPOINT: ${POL_SMS_ENDPOINT:-}
      POL_SMS_TOKEN: ${POL_SMS_TOKEN:-}
      POL_PUSH_PROVIDER: ${POL_PUSH_PROVIDER:-GENERIC_PUSH}
      POL_PUSH_ENDPOINT: ${POL_PUSH_ENDPOINT:-}
      POL_PUSH_TOKEN: ${POL_PUSH_TOKEN:-}
      POL_WORKER_INTERVAL_SECONDS: ${POL_WORKER_INTERVAL_SECONDS:-5}
      POL_WORKER_BATCH_SIZE: ${POL_WORKER_BATCH_SIZE:-50}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.worker_runtime"]
    networks: [pol_internal]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    expose: ["3001"]
    depends_on:
      api:
        condition: service_started
    networks: [pol_internal]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    networks: [pol_internal]

volumes:
  pol_pgdata:

networks:
  pol_internal:
    driver: bridge
