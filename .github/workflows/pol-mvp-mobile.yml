name: POL MVP Mobile Verification

on:
  push:
    branches: [main]
    paths:
      - "mvp/**"
      - ".github/workflows/pol-mvp-mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mvp/**"
      - ".github/workflows/pol-mvp-mobile.yml"

jobs:
  mobile:
    name: Expo mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: mvp/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck --workspace @pol/mobile

      - name: Functional state-transition QA
        run: npm run qa:functional --workspace @pol/mobile

      - name: Regression cross-module QA
        run: npm run qa:regression --workspace @pol/mobile

      - name: Deterministic Vendor mock transport QA
        run: npm run qa:mock --workspace @pol/mobile

      - name: Validate retailer Expo config
        working-directory: mvp/apps/mobile
        env:
          POL_APP_VARIANT: retailer
          EXPO_PUBLIC_APP_VARIANT: retailer
        run: npx expo config --type public

      - name: Validate vendor Expo config
        working-directory: mvp/apps/mobile
        env:
          POL_APP_VARIANT: vendor
          EXPO_PUBLIC_APP_VARIANT: vendor
        run: npx expo config --type public

      - name: Pre-APK release gate
        working-directory: mvp/apps/mobile
        env:
          POL_APP_VARIANT: vendor
        run: npm run qa:pre-apk

      - name: Expo Android export
        run: npm run build --workspace @pol/mobile
