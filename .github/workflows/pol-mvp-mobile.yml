name: POL MVP Mobile Verification

on:
  push:
    branches: [main, ui/visual-qa-screen-completion-20261025]
    paths:
      - "mvp/**"
      - ".github/workflows/pol-mvp-mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mvp/**"
      - ".github/workflows/pol-mvp-mobile.yml"

jobs:
  mobile:
    name: Expo mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: mvp/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck --workspace @pol/mobile

      - name: Functional state-transition QA
        run: npm run qa:functional --workspace @pol/mobile

      - name: Regression cross-module QA
        run: npm run qa:regression --workspace @pol/mobile

      - name: Deterministic Vendor mock transport QA
        run: npm run qa:mock --workspace @pol/mobile

      - name: Validate retailer Expo config
        working-directory: mvp/apps/mobile
        env:
          POL_APP_VARIANT: retailer
          EXPO_PUBLIC_APP_VARIANT: retailer
        run: npx expo config --type public

      - name: Validate vendor Expo config
        working-directory: mvp/apps/mobile
        env:
          POL_APP_VARIANT: vendor
          EXPO_PUBLIC_APP_VARIANT: vendor
        run: npx expo config --type public

      - name: Retailer pre-APK QA gate
        working-directory: mvp/apps/mobile
        env:
          POL_APP_VARIANT: retailer
          POL_RELEASE: "0"
        run: npm run qa:pre-apk

      - name: Vendor pre-APK QA gate
        working-directory: mvp/apps/mobile
        env:
          POL_APP_VARIANT: vendor
          POL_RELEASE: "0"
        run: npm run qa:pre-apk

      - name: Validate central TODO-084 gate syntax and behavior
        working-directory: mvp/apps/mobile
        run: |
          node --check scripts/check_prebuild_todo_gate.mjs
          node --check scripts/test_prebuild_todo_gate.mjs
          node scripts/test_prebuild_todo_gate.mjs

      - name: Expo Android export
        run: npm run build --workspace @pol/mobile
  prebuild_qa_gate:
    name: QA APK eligibility gate (TODO-084)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      allow_qa_apk: ${{ steps.todo_gate.outputs.allow_qa_apk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Evaluate required pre-build TODO evidence
        id: todo_gate
        working-directory: mvp/apps/mobile
        run: node scripts/check_prebuild_todo_gate.mjs

  android_qa_apks:
    name: ${{ matrix.variant }} Android QA APK
    if: github.event_name == 'pull_request' && needs.prebuild_qa_gate.outputs.allow_qa_apk == 'true'
    needs: [mobile, prebuild_qa_gate]
    strategy:
      fail-fast: false
      matrix:
        variant: [retailer, vendor]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/apps/mobile
    env:
      POL_APP_VARIANT: ${{ matrix.variant }}
      POL_RELEASE: "0"
      EXPO_PUBLIC_DATA_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: mvp/package-lock.json

      - name: Install
        working-directory: mvp
        run: npm ci

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build ${{ matrix.variant }} QA APK
        run: node scripts/build_android_variant.mjs ${{ matrix.variant }}

      - name: Upload ${{ matrix.variant }} QA APK
        uses: actions/upload-artifact@v4
        with:
          name: POL-${{ matrix.variant }}-QA-APK
          path: mvp/apps/mobile/dist/${{ matrix.variant }}/*.apk
          if-no-files-found: error
