name: POL Landing Page QA

on:
  pull_request:
    branches: [main]
    paths:
      - "mvp/apps/web/**"
      - "mvp/package.json"
      - "mvp/package-lock.json"
      - "mvp/packages/**"
      - "logo/**"
      - "deploy/Dockerfile.web"
      - ".github/workflows/pol-landing-qa.yml"
  push:
    branches:
      - "deploy/vps-self-hosted-20260928"
    paths:
      - "mvp/apps/web/**"
      - "mvp/package.json"
      - "mvp/package-lock.json"
      - "mvp/packages/**"
      - "logo/**"
      - "deploy/Dockerfile.web"
      - ".github/workflows/pol-landing-qa.yml"

jobs:
  web:
    name: Landing page build + runtime smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: mvp/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @pol/web

      - name: Lint
        run: npm run lint --workspace @pol/web

      - name: Production build
        run: npm run build --workspace @pol/web

      - name: Standalone runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          node apps/web/.next/standalone/apps/web/server.js > /tmp/pol-web.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/pol-home.html; then
              break
            fi
            sleep 1
          done

          grep -F "خرید عمده" /tmp/pol-home.html
          grep -F "یک مسیر روشن" /tmp/pol-home.html
          curl -fsS -o /tmp/pol-corporate.png http://127.0.0.1:3000/brand/corporate
          curl -fsS -o /tmp/pol-market.png http://127.0.0.1:3000/brand/market
          curl -fsS -o /tmp/pol-vendor.png http://127.0.0.1:3000/brand/vendor
          test -s /tmp/pol-corporate.png
          test -s /tmp/pol-market.png
          test -s /tmp/pol-vendor.png
          file /tmp/pol-corporate.png | grep -F "PNG image"
          file /tmp/pol-market.png | grep -F "PNG image"
          file /tmp/pol-vendor.png | grep -F "PNG image"

          echo "Landing route and canonical brand assets: PASS"
