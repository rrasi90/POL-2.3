name: POL Independent Verification & Certification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Independent Verification & Schema Hardening
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: pol_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply Canonical Dynamic Migration Chain (001 -> N)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          POL_PG_PORT: 5432
        run: |
          python scripts/migration_runner.py

      - name: Run Environment & Bootstrap Verifier
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          POL_PG_PORT: 5432
        run: |
          python scripts/verify_environment.py --json

      - name: Execute Full Verification Test Suite & Generate Artifact
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          POL_PG_PORT: 5432
          POL_JWT_SECRET: ci-test-secret-not-for-production
          ENVIRONMENT: test
        run: |
          python scripts/run_verification_suite.py

      - name: Generate current-SHA failure inventory and verification verdict
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifacts = Path("artifacts")
          artifacts.mkdir(parents=True, exist_ok=True)
          results_path = artifacts / "pol-test-results.json"
          run_sha = os.environ.get("GITHUB_SHA", "UNKNOWN")
          run_id = os.environ.get("GITHUB_RUN_ID", "UNKNOWN")
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "UNKNOWN")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "UNKNOWN")
          data = {}
          parse_error = None

          if results_path.is_file():
              try:
                  data = json.loads(results_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  parse_error = f"{type(exc).__name__}: {exc}"
          else:
              parse_error = "artifacts/pol-test-results.json was not produced"

          metadata = data.get("metadata", {}) if isinstance(data, dict) else {}
          summary = data.get("summary", {}) if isinstance(data, dict) else {}
          tests = data.get("tests", []) if isinstance(data, dict) else []
          git_meta = metadata.get("git", {}) if isinstance(metadata, dict) else {}
          tested_sha = git_meta.get("commit") or run_sha
          failed = int(summary.get("total_failed", 0) or 0)
          skipped = int(summary.get("total_skipped", 0) or 0)
          collected = int(summary.get("total_collected", len(tests)) or 0)
          passed = int(summary.get("total_passed", 0) or 0)
          exit_code = summary.get("exit_code")
          overall_status = str(summary.get("overall_status", "UNKNOWN"))
          non_pass = [
              test for test in tests
              if str(test.get("outcome", "")).lower() not in ("passed", "skipped")
          ]
          clean_pass = (
              parse_error is None
              and overall_status == "PASSED"
              and exit_code == 0
              and failed == 0
              and skipped == 0
              and collected == passed
          )

          inventory_lines = [
              "# POL-2.3 AUTOMATED VERIFICATION FAILURE INVENTORY",
              f"# Tested commit: {tested_sha}",
              f"# GitHub run: {run_id} (attempt {run_attempt}; event {event_name})",
              f"# Environment: {metadata.get('environment', 'UNKNOWN')}",
              f"# PostgreSQL: {metadata.get('postgresql', {}).get('version', 'UNKNOWN')}",
              f"# Total collected: {collected}",
              f"# Passed: {passed}",
              f"# Failed: {failed}",
              f"# Skipped: {skipped}",
              f"# Exit code: {exit_code if exit_code is not None else 'UNKNOWN'}",
          ]
          if parse_error:
              inventory_lines.extend(["", "# EVIDENCE INCOMPLETE", f"# Reason: {parse_error}"])
          elif clean_pass:
              inventory_lines.extend(["", "# NO ACTIVE TEST FAILURES. All collected tests passed with zero skips."])
          elif non_pass:
              inventory_lines.extend(["", "# NON-PASSING TESTS"])
              for test in non_pass:
                  inventory_lines.append(
                      f"- {test.get('nodeid', 'UNKNOWN_TEST')} | "
                      f"outcome={test.get('outcome', 'UNKNOWN')} | "
                      f"phase={test.get('phase', 'UNKNOWN')}"
                  )
          else:
              inventory_lines.extend(["", "# SUITE NOT CERTIFIED PASS: inspect summary and CI logs."])
          (artifacts / "failure_inventory.txt").write_text(
              "\n".join(inventory_lines) + "\n", encoding="utf-8"
          )

          results_sha256 = None
          if results_path.is_file():
              results_sha256 = hashlib.sha256(results_path.read_bytes()).hexdigest()
          report = {
              "schema_version": "1.0.0",
              "report_type": "automated_verification_evidence",
              "verdict": "AUTOMATED_TESTS_PASSED" if clean_pass else "AUTOMATED_TESTS_NOT_PASSED_OR_INCOMPLETE",
              "release_or_pilot_certification": "NOT_CLAIMED",
              "scope": "GitHub Actions automated verification suite only",
              "limitations": [
                  "This report does not certify physical-device installation or visual QA.",
                  "This report does not certify live SMS, live object storage, banking reconciliation, or legal/operational pilot readiness.",
                  "A passed automated test suite is not by itself a release authorization."
              ],
              "git": {
                  "tested_commit": tested_sha,
                  "github_workflow_sha": run_sha,
                  "branch": git_meta.get("branch", "UNKNOWN"),
                  "dirty": git_meta.get("is_dirty", "UNKNOWN")
              },
              "github_actions": {
                  "run_id": run_id,
                  "run_attempt": run_attempt,
                  "event": event_name
              },
              "environment": metadata.get("environment", "UNKNOWN"),
              "python": metadata.get("python", {}),
              "postgresql": metadata.get("postgresql", {}),
              "summary": {
                  "overall_status": overall_status,
                  "exit_code": exit_code,
                  "total_collected": collected,
                  "total_passed": passed,
                  "total_failed": failed,
                  "total_skipped": skipped,
                  "duration_seconds": summary.get("duration_seconds")
              },
              "test_results_sha256": results_sha256,
              "evidence_parse_error": parse_error
          }
          report_path = artifacts / f"final_certification_{run_sha}.json"
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"VERIFICATION_EVIDENCE_VERDICT={report['verdict']}")
          print(f"TESTED_COMMIT={tested_sha}")
          print(f"FAILURE_INVENTORY={artifacts / 'failure_inventory.txt'}")
          print(f"VERIFICATION_REPORT={report_path}")
          if parse_error:
              raise SystemExit(f"Could not produce complete verification evidence: {parse_error}")
          PY

      - name: Upload Complete Verification Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pol-verification-evidence
          path: |
            artifacts/pol-test-results.json
            artifacts/failure_inventory.txt
            artifacts/final_certification_${{ github.sha }}.json
          retention-days: 30
